# The FalseGreen contract for this program.
#
# A contract is a frozen definition of done. `[[criterion]]` rows are
# mechanical commands that run on every attempt — red fails the Job.
# `[[invariant]]` rows are claims carried by formal encodings in this
# repository; the proof toolchain discharges them and the signed report
# records the proposition it actually decided, verbatim.
schema = 1
language = "rust"
wall_seconds = 2700

# ── the mechanical floor ──────────────────────────────────────────────────
[[criterion]]
id = "build"
title = "the program compiles (release)"
required = true
  [[criterion.command]]
  argv = ["cargo", "build", "--release"]
  timeout_seconds = 600
  allowed_exit_codes = [0]

[[criterion]]
id = "tests"
title = "the full test suite passes offline"
required = true
  [[criterion.command]]
  argv = ["cargo", "test"]
  timeout_seconds = 900
  allowed_exit_codes = [0]

[[criterion]]
id = "clippy"
title = "clippy-clean (-D warnings)"
required = true
  [[criterion.command]]
  argv = ["cargo", "clippy", "--all-targets", "--", "-D", "warnings"]
  timeout_seconds = 900
  allowed_exit_codes = [0]

[[criterion]]
id = "formatting"
title = "rustfmt-clean"
required = false
  [[criterion.command]]
  argv = ["cargo", "fmt", "--all", "--check"]
  timeout_seconds = 120
  allowed_exit_codes = [0]

# ── the claim, with its two formal encodings ─────────────────────────────
# One sentence, two encodings the machines discharge:
# * Kani: a bounded model check over the SHIPPED arithmetic in
#   src/rules.rs (harness includes that file by path) over the FULL u64
#   domain — an overflow or wrap at the ceiling is a violation with a
#   concrete counterexample.
# * Creusot: an unbounded Why3 proof of the guarded specification in
#   src/spec.rs.
# History: the first attempt at this claim was DISPROVEN — the harness
# found `prev + 1` overflowing at the u64 ceiling — and the guard now in
# src/rules.rs is the fix the frozen claim forced. The claim never moved;
# the code did.
[[invariant]]
name = "chain linking is exact successor arithmetic and never wraps at the u64 ceiling"
description = "record N links to record N-1 iff prev_hash equals record N-1's hash AND seq is the exact u64 successor of record N-1's seq; the successor is never taken modulo the u64 ceiling — no seq may link past u64::MAX (the chain cannot wrap) — and on the guarded domain (prev below u64::MAX) the predicate is exactly seq == prev + 1"
plan_refs = ["formal-proofs", "floor-green", "both-rungs-proven"]
kani = "proofs/links_kani.rs"

[invariant.creusot]
# One bare item pattern, measured in the job image: why3find matches it
# against the translated sessions by item name, so `links` covers BOTH
# formal encodings of this claim — the shipped rule in src/rules.rs (its
# u64-addition safety obligation closes on the guard in the code) and the
# guarded specification in src/spec.rs: four obligations, all closed.
targets = ["links"]
mode = "prove"
provers = ["alt-ergo", "z3"]
timeout_ms = 30000
erasure_check = "warn"
