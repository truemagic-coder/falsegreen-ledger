schema = 1
language = "rust"
wall_seconds = 2700

[[criterion]]
id = "build"
title = "the workspace compiles"
required = true
  [[criterion.command]]
  argv = ["cargo", "build", "--workspace", "--release"]
  timeout_seconds = 600
  allowed_exit_codes = [0]

[[criterion]]
id = "tests"
title = "the full test suite passes offline"
required = true
  [[criterion.command]]
  argv = ["cargo", "test", "--workspace"]
  timeout_seconds = 900
  allowed_exit_codes = [0]

[[criterion]]
id = "lint"
title = "clippy and fmt are clean"
required = false
  [[criterion.command]]
  argv = ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
  timeout_seconds = 600
  [[criterion.command]]
  argv = ["cargo", "fmt", "--all", "--check"]
  timeout_seconds = 120

# Every invariant now carries a frozen executable `check` (0.11.0 ENFORCE:
# an invariant with no check is BAD_CONTRACT). These encodings are TEST-NAME
# REFERENCES into the crate's own suite — the WEAKER form, deliberately chosen
# for this corpus: a passing test proves that test passed, so the machine
# decision is "the pinned behaviour still holds", not a proof of the sentence
# above it. Judgement lives at freeze, in the choice of filter; the filter is
# then frozen into contract_sha256 and auditable forever. The last one is a doc
# assertion (the threat-model claim is about the README stating its scope).
# NOTE the filters are substrings of test names, so a filter matching nothing
# would be a vacuous pass ("0 passed; 0 failed" still says "0 failed"). So every
# check pins the MEASURED passed-count as well; a rename that drops a test out of the
# filter changes the count and fails the rung. Do not rename tests without editing
# both the filter and the pinned count.

[[invariant]]
name = "canonical bytes are stable"
description = "all hashed and signed material is canonical JSON (keys sorted lexicographically, no whitespace); hashing and signing always run over canonical bytes; key-order edits change stored JSON but not the canonical form (not tamper events), while any byte change to a value is; invalid values are rejected by validation, never silently normalized"
plan_refs = ["behavior-tests.a-canonical"]
check = { argv = ["cargo", "test", "-p", "falsegreen-ledger-core", "--offline", "--", "canonical"], expect_exit = 0, timeout_seconds = 300, expect_stdout_contains = ["5 passed;", "0 failed"] }

[[invariant]]
name = "invalid events are rejected, never normalized"
description = "event structs deny unknown fields; validation rejects empty required fields, a non-object context, out-of-range timestamps, and unknown fields; an invalid event is a corrupt-class failure at verify time, not a silent normalization"
plan_refs = ["behavior-tests.a-validate"]
check = { argv = ["cargo", "test", "-p", "falsegreen-ledger-core", "--offline", "--", "reject"], expect_exit = 0, timeout_seconds = 300, expect_stdout_contains = ["10 passed;", "0 failed"] }

[[invariant]]
name = "the hash chain commits to content and order"
description = "each record hash is SHA-256 over the canonical event map merged with prev_hash; the first record of the ledger links to GENESIS_HASH; record N links to N-1 iff prev_hash equals record N-1's hash AND seq equals record N-1's seq plus 1; any mismatch surfaces as a named failure: bad_record_hash, broken_link, or sequence_gap"
plan_refs = ["behavior-tests.a-chain"]
check = { argv = ["cargo", "test", "-p", "falsegreen-ledger-core", "--offline", "--", "chain::"], expect_exit = 0, timeout_seconds = 300, expect_stdout_contains = ["6 passed;", "0 failed"] }

[[invariant]]
name = "the shard store is append-only"
description = "one append-only JSONL file per shard (shard-NNNNNN.jsonl, zero-padded index); append continues the verified head — seq derived from the head record and prev_hash from the head hash or the previous shard's root — and never rewrites existing shard content; line-level parse errors report the shard and line number"
plan_refs = ["behavior-tests.a-append"]
check = { argv = ["cargo", "test", "-p", "falsegreen-ledger-core", "--offline", "--", "store::"], expect_exit = 0, timeout_seconds = 300, expect_stdout_contains = ["6 passed;", "0 failed"] }

[[invariant]]
name = "seals commit to the Merkle root and record count"
description = "the Merkle root is pairwise SHA-256 over the shard's record hashes with an odd final leaf duplicated; the Ed25519 signature covers the canonical JSON of {count, kind: seal, merkle_root, prev_shard_root, sealed_at_ms} — signature and public_key are not part of the message; flipping any seal field breaks the signature, and a count mismatch is bad_seal_count"
plan_refs = ["behavior-tests.a-seal"]
check = { argv = ["cargo", "test", "-p", "falsegreen-ledger-core", "--offline", "--", "integrity::"], expect_exit = 0, timeout_seconds = 300, expect_stdout_contains = ["7 passed;", "0 failed"] }

[[invariant]]
name = "compaction preserves the cross-shard root link"
description = "compact_last_sealed replaces the last sealed shard with a single compaction record carrying the original seal verbatim and keeping the shard's genesis prev_hash, so root links into and out of the shard are unchanged; the new seal (count 1) re-signs over the compaction record; rewriting a compacted shard breaks the seal signature; the original content is no longer reconstructible from the ledger"
plan_refs = ["behavior-tests.a-compact"]
check = { argv = ["cargo", "test", "-p", "falsegreen-ledger-core", "--offline", "--", "compact::"], expect_exit = 0, timeout_seconds = 300, expect_stdout_contains = ["3 passed;", "0 failed"] }

[[invariant]]
name = "policy evaluation is per-event and per-rule"
description = "at verify time every ledger event is evaluated against every policy rule: a deny rule flags any event matching its set matchers, a require_outcome rule flags a matching event whose decision outcome differs; violations appear as policy_violation failures carrying the rule_id"
plan_refs = ["behavior-tests.a-policy"]
check = { argv = ["cargo", "test", "-p", "falsegreen-ledger-core", "--offline", "--", "policy::"], expect_exit = 0, timeout_seconds = 300, expect_stdout_contains = ["5 passed;", "0 failed"] }

[[invariant]]
name = "exit codes form the CI contract with fixed precedence"
description = "verify exits 0 clean, 1 tampered (bad_record_hash, broken_link, bad_merkle_root, broken_root_link), 2 gap (sequence_gap), 3 signature (bad_signature, bad_seal_count), 4 policy (policy_violation), 5 corrupt (parse_line, invalid_event, bad_seal_structure), 255 usage; when several classes coexist the most specific diagnosis wins in the order corrupt, gap, signature, tampered, policy"
plan_refs = ["behavior-tests.a-exit"]
check = { argv = ["cargo", "test", "-p", "falsegreen-ledger", "--test", "integration", "--offline", "--", "exits"], expect_exit = 0, timeout_seconds = 300, expect_stdout_contains = ["2 passed;", "0 failed"] }

[[invariant]]
name = "export and import round-trips are hash-stable"
description = "export emits one JSON document with deterministic typed shard serialization (never the raw stored lines, so file key order cannot leak); importing an exported ledger's events (without seq — it is derived) into a fresh ledger reproduces identical record hashes"
plan_refs = ["behavior-tests.a-roundtrip"]
check = { argv = ["cargo", "test", "-p", "falsegreen-ledger", "--test", "integration", "--offline", "--", "roundtrip"], expect_exit = 0, timeout_seconds = 300, expect_stdout_contains = ["1 passed;", "0 failed"] }

[[invariant]]
name = "the threat model states exactly what verify proves"
description = "given an uncorrupted copy of the sealed shards and a known public key, verify proves content integrity, ordering and completeness within a shard, seal integrity, cross-shard continuity, and the compaction boundary; it does not prove: total replacement by a private-key holder with a re-signed shard, unanchored pre-seal history, shard loss (detected, not repaired), the truthfulness of written events, or membership of the policy file in the signed boundary"
plan_refs = ["contract-invariants.a-scope-stated"]
check = { argv = ["grep", "-qi", "threat model", "README.md"], expect_exit = 0, timeout_seconds = 30 }

# ── 0.13.0 adversarial campaign, run A: the proof ladder over REAL code ────
# The two claims below are decided by ALL applicable rungs, on code the
# shipped binary actually executes (extracted dependency-free into
# `ledger-rules`; the L2 encoding is `ledger-spec`): L0 executable check +
# L1 Kani over the full u64 domain + (chain claim) L2 Creusot over the
# guarded spec. The chain claim is deliberately stated as the STRONGER
# sentence ("never wraps") than the shipped arithmetic ("prev + 1",
# unguarded): if the machine disproves the sentence, the REPAIR LOOP fixes
# the code — the frozen claim stays. That is the campaign's point.
[[invariant]]
name = "shard naming is total, fixed-width, and order-preserving on the documented index domain"
description = "for every u32 shard index up to 999_999 the store name shard-NNNNNN.jsonl round-trips back to the exact index through the directory-scan parser, has fixed width 19, and lexicographic name order equals numeric index order (which is what makes the store's sorted scan sound)"
plan_refs = ["ladder.a-naming"]
check = { argv = ["cargo", "test", "-p", "ledger-rules", "--offline", "--", "shardname::"], expect_exit = 0, timeout_seconds = 300, expect_stdout_contains = ["2 passed;", "0 failed"] }
kani = "proofs/shardname_kani.rs"

[[invariant]]
name = "chain linking is exact successor arithmetic and never wraps at the u64 ceiling"
description = "record N links to record N-1 iff prev_hash equals record N-1's hash AND seq is the exact u64 successor of record N-1's seq; the successor is never taken modulo the u64 ceiling — no seq may link past u64::MAX (the chain cannot wrap) — and on the guarded domain (prev below u64::MAX) the predicate is exactly seq == prev + 1"
plan_refs = ["ladder.a-links"]
check = { argv = ["cargo", "test", "-p", "ledger-rules", "--offline", "--", "links::"], expect_exit = 0, timeout_seconds = 900, expect_stdout_contains = ["2 passed;", "0 failed"] }
kani = "proofs/links_kani.rs"

[invariant.creusot]
targets = ["links"]
provers = ["alt-ergo", "z3"]
timeout_ms = 30000
