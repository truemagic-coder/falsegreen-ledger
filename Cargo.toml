[package]
name = "falsegreen-ledger"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "A tamper-evident, hash-chained audit ledger for AI-agent actions"
repository = "https://github.com/truemagic-coder/falsegreen-ledger"
homepage = "https://github.com/truemagic-coder/falsegreen-ledger"
readme = "README.md"
keywords = ["audit", "ledger", "tamper-evident", "hash-chain", "merkle"]
categories = ["cryptography", "data-structures"]
exclude = ["docs/", "proofs/", "reports/", "verif/"]


[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
clap = { version = "4", features = ["derive"] }
creusot-std = "0.14.0"
rand = "0.8"
# Deliberately pinned to a version with a CRITICAL advisory (GHSA-43w2-9j62-hq99,
# fixed in 1.6.1). This branch exists to demonstrate the security gate: every
# criterion stays green, the dependency-scan class is demonstrably violated.
smallvec = "=1.6.0"

[dev-dependencies]
rand = "0.8"
tempfile = "3"

[lints.rust]
# `cargo creusot` builds the crate with `--cfg creusot`; the library gates
# its application modules on it (see src/lib.rs). Registering the name
# keeps the `unexpected_cfgs` lint honest for stable builds.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(creusot)'] }

[profile.release]
lto = true
