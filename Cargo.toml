[workspace]
resolver = "2"
members = ["crates/falsegreen-ledger-core", "crates/falsegreen-ledger"]
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
tempfile = "3"

[profile.release]
lto = true
